<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santes Mod</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0d0d0d;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 420px;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .key-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
      cursor: pointer;
      transition: 0.2s;
      user-select: none;
    }

    .key-box:hover {
      transform: scale(1.02);
      background: #202020;
    }

    .key {
      font-size: 20px;
      font-weight: bold;
      color: #00ff88;
    }

    .instruction {
      margin-top: 10px;
      color: #999;
      font-size: 13px;
    }

    #msg {
      margin-top: 15px;
      color: #00ff88;
      font-size: 14px;
      display: none;
    }
  </style></head><body>  <div class="container">
    <h1>Santes Mod</h1><div class="key-box" onclick="copiarKey()">
  <div class="key">santezgx-ft2915</div>
  <div class="instruction">Clique para copiar</div>
</div>

<div id="msg">Copiado!</div>

  </div>  <script>
    function copiarKey() {
      navigator.clipboard.writeText("santezgx-ft2915");

      const msg = document.getElementById("msg");
      msg.style.display = "block";

      setTimeout(() => {
        msg.style.display = "none";
      }, 1500);
    }
  </script></body>
</html>
